name: test

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to test
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NYTRIX_TEST_COLD: "1"

jobs:
  test-ubuntu:
    if: ${{ inputs.target == 'all' || inputs.target == 'ubuntu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NYTRIX_TEST_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./make test

  test-macos:
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NYTRIX_TEST_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./make test

  test-windows:
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NYTRIX_TEST_JOBS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./make test