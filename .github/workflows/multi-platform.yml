name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Platform to test
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows
      suite:
        description: Test breadth for manual runs
        required: false
        default: standard
        type: choice
        options:
          - standard
          - full-stdlib
      checks:
        description: Optional checks for manual runs
        required: false
        default: tests
        type: choice
        options:
          - tests
          - memory-safety
          - coverage
          - all

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NYTRIX_TEST_COLD: "1"
  # Keep functional CI independent from timed benchmark variance.
  # Benchmark parity remains available through ./make bench and dedicated runs.
  NYTRIX_TEST_NO_BENCH: "1"

jobs:
  test-ubuntu:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ubuntu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The hosted Ubuntu runner exposes only 1–2 CPUs. Keep the fixture
      # scheduler deterministic until the standard suite is green; parallel
      # stress remains available locally with NYTRIX_TEST_JOBS=2+.
      NYTRIX_TEST_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify Ubuntu runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          command -v lcov
          command -v genhtml
          ./make bin
          if nm -u build/release/ny-full | grep -q '__gmp'; then
            echo "unexpected GMP dependency"
            exit 1
          fi
      - run: |
          if [ "${{ inputs.suite }}" = "full-stdlib" ]; then
            ./make test --with-stdlib
          else
            ./make test
          fi
      - name: Run ASan suite
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'memory-safety' || inputs.checks == 'all') }}
        run: |
          if [ "${{ inputs.suite }}" = "full-stdlib" ]; then
            ./make asan --with-stdlib
          else
            ./make asan
          fi
          ./make asan fuzz
      - name: Run UBSan suite
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'memory-safety' || inputs.checks == 'all') }}
        run: |
          if [ "${{ inputs.suite }}" = "full-stdlib" ]; then
            ./make ubsan --with-stdlib
          else
            ./make ubsan
          fi
          ./make ubsan fuzz
      - name: Run Valgrind smoke
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'memory-safety' || inputs.checks == 'all') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          ./make bin
          valgrind --trace-children=yes --leak-check=full --show-leak-kinds=definite \
            --errors-for-leak-kinds=definite --error-exitcode=97 \
            build/release/ny-test --bin build/release/ny-full \
            --pattern memory-safety-smoke
      - name: Run coverage through the repository driver
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'coverage' || inputs.checks == 'all') }}
        run: |
          ./make coverage --test --pattern runtime --failures-only
          ./make coverage --test --pattern user-type-prefix --failures-only
      - name: Upload coverage
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'coverage' || inputs.checks == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: |
            build/coverage/coverage.info
            build/coverage/coverage-html

  test-macos:
    # Keep pushes staged on Ubuntu; run macOS explicitly after Ubuntu is green.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'macos')) }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NYTRIX_TEST_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          if [ "${{ inputs.suite }}" = "full-stdlib" ]; then
            ./make test --with-stdlib
          else
            ./make test
          fi
      - name: Run ASan and UBSan suite
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'memory-safety' || inputs.checks == 'all') }}
        run: |
          if [ "${{ inputs.suite }}" = "full-stdlib" ]; then
            ./make asan --with-stdlib
            ./make ubsan --with-stdlib
          else
            ./make asan
            ./make ubsan
          fi

  test-windows:
    # Keep pushes staged on Ubuntu; run Windows explicitly after Ubuntu is green.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'windows')) }}
    runs-on: windows-latest
    timeout-minutes: 90
    # Native test artifacts share Windows temp paths and compiler state.
    # Keep this platform serialized until those paths are isolated.
    env:
      NYTRIX_TEST_JOBS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          if [ "${{ inputs.suite }}" = "full-stdlib" ]; then
            ./make test --with-stdlib
          else
            ./make test
          fi
      - name: Run ASan and UBSan suite
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'memory-safety' || inputs.checks == 'all') }}
        run: |
          if [ "${{ inputs.suite }}" = "full-stdlib" ]; then
            ./make asan --with-stdlib
            ./make ubsan --with-stdlib
          else
            ./make asan
            ./make ubsan
          fi
